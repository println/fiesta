name: Site

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redeploy-from-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp the release version
        run: |
          version=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          version=${version#v}
          sed -i -E \
            -e "s/(\"softwareVersion\": \")[0-9.]+/\1$version/" \
            -e "s/(<p class=\"release\">v)[0-9.]+/\1$version/" \
            -e "s/(<li class=\"now\">.*<small>)[0-9.]+/\1$version/" \
            site/index.html site/pt-br/index.html
          grep -c "$version" site/index.html site/pt-br/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
