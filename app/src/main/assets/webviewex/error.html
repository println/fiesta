<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding: 32px 24px; text-align: center; box-sizing: border-box; }
  svg { width: 56px; height: 56px; margin-bottom: 20px; color: var(--icon); }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; line-height: 1.3; }
  p.message { color: var(--muted); font-size: 14px; margin: 0 0 20px; max-width: 320px; line-height: 1.4; }
  p.status { color: var(--status); font-size: 13px; margin: 0 0 20px; min-height: 18px; }
  .actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  body.compact .actions { flex-direction: row; gap: 24px; }
  button { min-width: 180px; height: 48px; padding: 0 24px; border: 0; border-radius: 24px; font-size: 15px; font-weight: 700;
           background: var(--surface); color: var(--secondary-accent); }
  body.compact button { min-width: 220px; height: 64px; font-size: 18px; border-radius: 32px; }
  button.primary { background: var(--accent); color: var(--accent-fg); }
  summary { color: var(--secondary-accent); }
  details { margin-top: 24px; max-width: 320px; color: var(--muted); font-size: 12px; text-align: left; word-break: break-all; }
  summary { text-align: center; cursor: pointer; }
</style>
</head>
<body>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
  <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
  <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
</svg>
<h1 id="title"></h1>
<p class="message" id="message"></p>
<p class="status" id="status"></p>
<div class="actions" id="actions"></div>
<details id="details"><summary id="detailsLabel"></summary><div id="detailsBody"></div></details>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function() {
  var state = JSON.parse(document.getElementById('payload').textContent);
  document.title = 'webviewex-error:' + state.token;
  var palette = state.theme;
  var root = document.documentElement.style;
  root.setProperty('--bg', palette.background);
  root.setProperty('--fg', palette.text);
  root.setProperty('--muted', palette.mutedText);
  root.setProperty('--surface', palette.surface);
  root.setProperty('--accent', palette.accent);
  root.setProperty('--accent-fg', palette.accentText);
  root.setProperty('--secondary-accent', palette.secondaryAccent);
  root.setProperty('--status', palette.statusText);
  root.setProperty('--icon', palette.iconTint);
  document.body.className = state.style;
  document.getElementById('title').textContent = state.title;
  document.getElementById('message').textContent = state.message;

  var actionsBox = document.getElementById('actions');
  function renderActions(actions) {
    actionsBox.textContent = '';
    actions.forEach(function(action) {
      var button = document.createElement('button');
      button.textContent = action.label;
      if (action.primary) { button.className = 'primary'; }
      button.onclick = function() { window.webviewex.perform(state.token, action.id); };
      actionsBox.appendChild(button);
    });
  }
  renderActions(state.actions);

  var details = document.getElementById('details');
  if (state.details && state.details.length) {
    document.getElementById('detailsLabel').textContent = state.detailsLabel;
    document.getElementById('detailsBody').textContent = state.details.join('\n');
  } else {
    details.style.display = 'none';
  }

  window.__webviewexError = {
    update: function(update) {
      document.getElementById('status').textContent = update.status || '';
      if (update.actions) { renderActions(update.actions); }
    }
  };
  document.getElementById('status').textContent = state.status || '';
})();
</script>
</body>
</html>
